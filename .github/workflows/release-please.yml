## Runs the release-please action for all new pushes to the main branch.
##   This will create new release-PRs, create GitHub and npm releases,
##   and update the CHANGELOG.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

name: Release Please

jobs:
  build-and-test:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  release-please:
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_ready: ${{ steps.release.outputs.release_created }}
    steps:
      - id: release
        name: Release Please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.SYNCED_GITHUB_TOKEN_REPO }}

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_ready }}
    permissions:
      contents: read
    uses: ./.github/workflows/publish.yml
    secrets:
      NPM_WOMBOT_TOKEN: ${{ secrets.NPM_WOMBOT_TOKEN }}
